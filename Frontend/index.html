<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AfriMind AI</title>

<style>

*{
    box-sizing:border-box;
    font-family: Arial, sans-serif;
}

body{

    margin:0;
    background:#f1f5f9;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;

}


.container{

    width:100%;
    max-width:900px;
    height:95vh;
    background:white;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,0.1);
    display:flex;
    flex-direction:column;
    overflow:hidden;

}



.header{

    background:#0f766e;
    color:white;
    padding:20px;
    text-align:center;

}


.header h1{

    margin:0;
    font-size:28px;

}


.header p{

    margin:5px;

}



.chat{

    flex:1;
    padding:20px;
    overflow-y:auto;

}



.message{

    padding:12px 16px;
    margin:10px;
    border-radius:15px;
    max-width:75%;
    line-height:1.5;

}



.user{

    background:#0f766e;
    color:white;
    margin-left:auto;

}



.ai{

    background:#e2e8f0;
    color:#111827;

}



.input-area{

    display:flex;
    padding:15px;
    border-top:1px solid #ddd;

}



input{

    flex:1;
    padding:15px;
    border-radius:10px;
    border:1px solid #ccc;
    font-size:16px;

}



button{

    margin-left:10px;
    padding:15px 25px;
    border:none;
    border-radius:10px;
    background:#0f766e;
    color:white;
    cursor:pointer;
    font-size:16px;

}


button:hover{

    background:#115e59;

}


</style>

</head>


<body>


<div class="container">


<div class="header">

<h1>🌍 AfriMind AI</h1>

<p>Your Intelligent Assistant for Africa</p>

</div>



<div class="chat" id="chat">


<div class="message ai">

Hello 👋 I am AfriMind AI. Ask me anything about Africa, business, agriculture, health and technology.

</div>


</div>




<div class="input-area">

<input id="question" placeholder="Ask AfriMind...">

<button onclick="ask()">Send</button>

</div>



</div>



<script>


async function ask(){


let input=document.getElementById("question");

let question=input.value;


if(question=="") return;



let chat=document.getElementById("chat");



chat.innerHTML += `

<div class="message user">
${question}
</div>

`;



input.value="";



let response = await fetch("/ask",{

method:"POST",

headers:{

"Content-Type":"application/json"

},

body:JSON.stringify({

question:question

})

});



let data=await response.json();



chat.innerHTML += `

<div class="message ai">

${data.answer}

</div>

`;



chat.scrollTop=chat.scrollHeight;



}


</script>


</body>

</html>
