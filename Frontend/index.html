<!DOCTYPE html>
<html>

<head>

<title>AfriMind AI</title>

<style>

body {

    font-family: Arial, sans-serif;
    background: #f1f5f9;
    margin: 0;

}


.header {

    background: #0f766e;
    color: white;
    text-align: center;
    padding: 20px;

}


.container {

    width: 80%;
    margin: 30px auto;
    background: white;
    padding: 20px;
    border-radius: 15px;

}


.chat {

    height: 400px;
    overflow-y: auto;
    border: 1px solid #ddd;
    padding: 15px;
    border-radius: 10px;

}


.user {

    background: #dbeafe;
    padding: 10px;
    margin: 10px;
    border-radius: 10px;
    text-align: right;

}


.ai {

    background: #dcfce7;
    padding: 10px;
    margin: 10px;
    border-radius: 10px;
    text-align: left;

}


.input-area {

    display: flex;
    margin-top: 15px;

}


input {

    flex: 1;
    padding: 12px;
    font-size: 16px;

}


button {

    padding: 12px 20px;
    background: #0f766e;
    color: white;
    border: none;
    cursor: pointer;

}


button:hover {

    background: #115e59;

}


</style>

</head>


<body>


<div class="header">

<h1>🌍 AfriMind AI</h1>

<p>Building Intelligence for Africa</p>

<p>Version 28.2</p>

</div>



<div class="container">


<div id="chat" class="chat">

<div class="ai">

🤖 AfriMind: Hello Edward, I am ready to help Africa.

</div>


</div>



<div class="input-area">

<input id="question" placeholder="Ask AfriMind...">

<button onclick="ask()">

Ask

</button>


</div>


</div>



<script>


async function ask(){


let input = document.getElementById("question");

let question = input.value;


if(question.trim()=="")
return;



let chat = document.getElementById("chat");



chat.innerHTML +=

`
<div class="user">
👤 You: ${question}
</div>
`;



chat.innerHTML +=

`
<div class="ai">
🤖 AfriMind is thinking...
</div>
`;



let response = await fetch("/ask", {

method:"POST",

headers:{

"Content-Type":"application/json"

},

body: JSON.stringify({

question:question

})

});



let data = await response.json();



chat.innerHTML +=

`
<div class="ai">
🤖 AfriMind: ${data.answer}
</div>
`;



chat.scrollTop = chat.scrollHeight;



input.value="";


}


</script>


</body>

</html>
